# Four isolated tenant stacks behind one development edge router. Backend
# runtime roles are separate containers so their networks match their trust
# boundaries rather than one process bridging ingress, mesh, and PostgreSQL.
name: vetchium

x-hardening: &hardening
  security_opt: [no-new-privileges:true]

x-postgres-env: &postgres-env
  POSTGRES_DB: ${POSTGRES_DB:-tenant_db}
  POSTGRES_USER: ${POSTGRES_USER:-pguser}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
  POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256

x-db: &db
  <<: *hardening
  image: postgres:17.6-alpine
  restart: unless-stopped
  environment: *postgres-env
  healthcheck:
    test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

x-traefik: &traefik
  <<: *hardening
  image: traefik:v3.4.1
  restart: unless-stopped
  command:
    - --providers.file.filename=/etc/traefik/dynamic.yml
    - --providers.file.watch=true
    - --entrypoints.web.address=:80
    - --ping=true
    - --log.level=INFO
    - --accesslog=true
  healthcheck:
    test: [CMD, traefik, healthcheck, --ping]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

x-migrate: &migrate
  <<: *hardening
  build: {context: migrations}
  restart: "no"
  read_only: true

x-provision-app-role: &provision-app-role
  <<: *hardening
  image: postgres:17.6-alpine
  restart: "no"
  read_only: true
  command: [psql, --no-password, -v, ON_ERROR_STOP=1, -f, /provision/provision-app-role.sql]
  volumes: [./migrations/provision-app-role.sql:/provision/provision-app-role.sql:ro]

x-seed: &seed
  <<: *hardening
  image: postgres:17.6-alpine
  restart: "no"
  read_only: true
  command: [psql, --no-password, -v, ON_ERROR_STOP=1, "-1", -f, /seed/01_seed.sql]

x-backend: &backend
  <<: *hardening
  restart: unless-stopped
  read_only: true
  configs:
    - source: app_postgres_password
      target: /run/secrets/app_postgres_password
  healthcheck:
    test: [CMD, /service, readycheck]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

x-backend-sgp-env: &backend-sgp-env
  TENANT_ID: sgp
  PGHOST: db-sgp
  PGPORT: "5432"
  PGUSER: vetchium_app
  PGDATABASE: ${POSTGRES_DB:-tenant_db}
  PGPASSWORD_FILE: /run/secrets/app_postgres_password
  PGSSLMODE: ${PGSSLMODE:-disable}

x-backend-usa1-env: &backend-usa1-env
  TENANT_ID: usa1
  PGHOST: db-usa1
  PGPORT: "5432"
  PGUSER: vetchium_app
  PGDATABASE: ${POSTGRES_DB:-tenant_db}
  PGPASSWORD_FILE: /run/secrets/app_postgres_password
  PGSSLMODE: ${PGSSLMODE:-disable}

x-backend-deu-env: &backend-deu-env
  TENANT_ID: deu
  PGHOST: db-deu
  PGPORT: "5432"
  PGUSER: vetchium_app
  PGDATABASE: ${POSTGRES_DB:-tenant_db}
  PGPASSWORD_FILE: /run/secrets/app_postgres_password
  PGSSLMODE: ${PGSSLMODE:-disable}

x-backend-ind1-env: &backend-ind1-env
  TENANT_ID: ind1
  PGHOST: db-ind1
  PGPORT: "5432"
  PGUSER: vetchium_app
  PGDATABASE: ${POSTGRES_DB:-tenant_db}
  PGPASSWORD_FILE: /run/secrets/app_postgres_password
  PGSSLMODE: ${PGSSLMODE:-disable}

x-ui: &ui
  <<: *hardening
  restart: unless-stopped

services:
  # Singapore ---------------------------------------------------------------
  traefik-sgp:
    <<: *traefik
    networks: [sgp_ingress, sgp_admin_api_access, sgp_hub_api_access, sgp_orgs_api_access, sgp_mcp_access]
    volumes: [./traefik/sgp.yml:/etc/traefik/dynamic.yml:ro]

  db-sgp:
    <<: *db
    networks: [sgp_backend]
    volumes: [pgdata-sgp:/var/lib/postgresql/data]

  provision-app-role-sgp:
    <<: *provision-app-role
    environment:
      PGHOST: db-sgp
      PGUSER: ${POSTGRES_USER:-pguser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      PGDATABASE: ${POSTGRES_DB:-tenant_db}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-app_pgpassword}
    networks: [sgp_backend]
    depends_on: {db-sgp: {condition: service_healthy}}

  migrate-sgp:
    <<: *migrate
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpassword}@db-sgp:5432/${POSTGRES_DB:-tenant_db}?sslmode=${PGSSLMODE:-disable}
    networks: [sgp_backend]
    depends_on: {provision-app-role-sgp: {condition: service_completed_successfully}}

  seed-sgp:
    <<: *seed
    environment:
      PGHOST: db-sgp
      PGUSER: ${POSTGRES_USER:-pguser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      PGDATABASE: ${POSTGRES_DB:-tenant_db}
    volumes: [./migrations/sgp:/seed:ro]
    networks: [sgp_backend]
    depends_on: {migrate-sgp: {condition: service_completed_successfully}}

  admin-api-sgp:
    <<: *backend
    build: {context: backend, target: admin-api}
    environment: *backend-sgp-env
    networks: [sgp_admin_api_access, sgp_backend]
    depends_on: {seed-sgp: {condition: service_completed_successfully}}

  hub-api-sgp:
    <<: *backend
    build: {context: backend, target: hub-api}
    environment: *backend-sgp-env
    networks: [sgp_hub_api_access, sgp_backend]
    depends_on: {seed-sgp: {condition: service_completed_successfully}}

  orgs-api-sgp:
    <<: *backend
    build: {context: backend, target: orgs-api}
    environment: *backend-sgp-env
    networks: [sgp_orgs_api_access, sgp_backend]
    depends_on: {seed-sgp: {condition: service_completed_successfully}}

  mesh-api-sgp:
    <<: *backend
    build: {context: backend, target: mesh-api}
    environment: *backend-sgp-env
    networks: [mesh, sgp_backend]
    depends_on: {seed-sgp: {condition: service_completed_successfully}}

  mcp-server-sgp:
    <<: *backend
    build: {context: backend, target: mcp-server}
    environment: *backend-sgp-env
    networks:
      sgp_mcp_access: {aliases: [mcp-server]}
      sgp_backend: {}
    depends_on: {seed-sgp: {condition: service_completed_successfully}}

  workers-sgp:
    <<: *backend
    build: {context: backend, target: workers}
    environment: *backend-sgp-env
    networks: [sgp_backend]
    depends_on: {seed-sgp: {condition: service_completed_successfully}}

  orgs-ui-sgp:
    <<: *ui
    build: {context: orgs-ui}
    networks: [sgp_ingress]
  hub-ui-sgp:
    <<: *ui
    build: {context: hub-ui}
    networks: [sgp_ingress]
  admin-ui-sgp:
    <<: *ui
    build: {context: admin-ui}
    networks: [sgp_ingress]

  # United States -----------------------------------------------------------
  traefik-usa1:
    <<: *traefik
    networks: [usa1_ingress, usa1_admin_api_access, usa1_hub_api_access, usa1_orgs_api_access, usa1_mcp_access]
