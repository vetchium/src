    depends_on: {seed-usa1: {condition: service_completed_successfully}}
  mcp-server-usa1:
    <<: *backend
    build: {context: backend, target: mcp-server}
    environment: *backend-usa1-env
    networks:
      usa1_mcp_access: {aliases: [mcp-server]}
      usa1_backend: {}
    depends_on: {seed-usa1: {condition: service_completed_successfully}}
  workers-usa1:
    <<: *backend
    build: {context: backend, target: workers}
    environment: *backend-usa1-env
    networks: [usa1_backend]
    depends_on: {seed-usa1: {condition: service_completed_successfully}}
  orgs-ui-usa1:
    <<: *ui
    build: {context: orgs-ui}
    networks: [usa1_ingress]
  hub-ui-usa1:
    <<: *ui
    build: {context: hub-ui}
    networks: [usa1_ingress]
  admin-ui-usa1:
    <<: *ui
    build: {context: admin-ui}
    networks: [usa1_ingress]

  # Germany -----------------------------------------------------------------
  traefik-deu:
    <<: *traefik
    networks: [deu_ingress, deu_admin_api_access, deu_hub_api_access, deu_orgs_api_access, deu_mcp_access]
