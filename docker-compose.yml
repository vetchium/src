  hub-ui-ind1:
    <<: *ui
    build: {context: hub-ui}
    networks: [ind1_ingress]
  admin-ui-ind1:
    <<: *ui
    build: {context: admin-ui}
    networks: [ind1_ingress]

  edge:
    <<: *traefik
    ports: ["${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-80}:80"]
    networks: [sgp_ingress, usa1_ingress, deu_ingress, ind1_ingress]
    volumes: [./traefik/edge.yml:/etc/traefik/dynamic.yml:ro]
    depends_on:
      traefik-sgp: {condition: service_healthy}
      traefik-usa1: {condition: service_healthy}
      traefik-deu: {condition: service_healthy}
      traefik-ind1: {condition: service_healthy}

networks:
  # Only mesh-api containers join this internal network. A future WireGuard
  # gateway should be the sole additional member; mesh-api ports stay unpublished.
  mesh: {internal: true}
  sgp_ingress: {}
  sgp_admin_api_access: {internal: true}
  sgp_hub_api_access: {internal: true}
  sgp_orgs_api_access: {internal: true}
  sgp_mcp_access: {internal: true}
  sgp_backend: {internal: true}
  usa1_ingress: {}
  usa1_admin_api_access: {internal: true}
  usa1_hub_api_access: {internal: true}
  usa1_orgs_api_access: {internal: true}
  usa1_mcp_access: {internal: true}
  usa1_backend: {internal: true}
  deu_ingress: {}
  deu_admin_api_access: {internal: true}
  deu_hub_api_access: {internal: true}
  deu_orgs_api_access: {internal: true}
  deu_mcp_access: {internal: true}
  deu_backend: {internal: true}
  ind1_ingress: {}
  ind1_admin_api_access: {internal: true}
  ind1_hub_api_access: {internal: true}
  ind1_orgs_api_access: {internal: true}
  ind1_mcp_access: {internal: true}
  ind1_backend: {internal: true}

volumes:
  pgdata-sgp: {}
  pgdata-usa1: {}
  pgdata-deu: {}
  pgdata-ind1: {}

configs:
  postgres_password:
    content: ${POSTGRES_PASSWORD:-pgpassword}
  app_postgres_password:
    content: ${APP_POSTGRES_PASSWORD:-app_pgpassword}
