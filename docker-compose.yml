      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-app_pgpassword}
    networks: [usa1_backend]
    depends_on: {db-usa1: {condition: service_healthy}}
  migrate-usa1:
    <<: *migrate
    environment:
