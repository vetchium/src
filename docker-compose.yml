    build: {context: backend, target: orgs-api}
    environment: *backend-deu-env
    networks: [deu_orgs_api_access, deu_backend]
    depends_on: {seed-deu: {condition: service_completed_successfully}}
  mesh-api-deu:
    <<: *backend
    build: {context: backend, target: mesh-api}
    environment: *backend-deu-env
