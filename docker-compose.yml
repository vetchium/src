  migrate-deu:
    <<: *migrate
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-pguser}:${POSTGRES_PASSWORD:-pgpassword}@db-deu:5432/${POSTGRES_DB:-tenant_db}?sslmode=${PGSSLMODE:-disable}
    networks: [deu_backend]
    depends_on: {provision-app-role-deu: {condition: service_completed_successfully}}
  seed-deu:
    <<: *seed
    environment:
      PGHOST: db-deu
      PGUSER: ${POSTGRES_USER:-pguser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      PGDATABASE: ${POSTGRES_DB:-tenant_db}
    volumes: [./migrations/deu:/seed:ro]
    networks: [deu_backend]
    depends_on: {migrate-deu: {condition: service_completed_successfully}}
  admin-api-deu:
    <<: *backend
    build: {context: backend, target: admin-api}
    environment: *backend-deu-env
    networks: [deu_admin_api_access, deu_backend]
    depends_on: {seed-deu: {condition: service_completed_successfully}}
  hub-api-deu:
    <<: *backend
    build: {context: backend, target: hub-api}
    environment: *backend-deu-env
    networks: [deu_hub_api_access, deu_backend]
    depends_on: {seed-deu: {condition: service_completed_successfully}}
  orgs-api-deu:
