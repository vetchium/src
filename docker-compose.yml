    depends_on: {seed-ind1: {condition: service_completed_successfully}}
  mesh-api-ind1:
    <<: *backend
    build: {context: backend, target: mesh-api}
    environment: *backend-ind1-env
    networks: [mesh, ind1_backend]
    depends_on: {seed-ind1: {condition: service_completed_successfully}}
  mcp-server-ind1:
    <<: *backend
    build: {context: backend, target: mcp-server}
    environment: *backend-ind1-env
    networks:
