<p>Vetchium-இல் ஒரு தொழில்முறை மின்னஞ்சல் முகவரியை நீங்கள் கட்டுப்படுத்துகிறீர்கள் என்பதை உறுதிப்படுத்த குறியீடு கேட்டுள்ளீர்கள்.</p>
<p>உங்கள் குறியீடு <strong>{{.Code}}</strong>. நீங்கள் கேட்ட 10 நிமிடங்களுக்குப் பிறகு அது காலாவதியாகும்.</p>
<p>இந்தக் குறியீட்டை நீங்கள் கேட்கவில்லை என்றால், இந்தச் செய்தியைப் புறக்கணிக்கலாம்.</p>
