<p>இந்த முகவரியை உங்கள் Vetchium கணக்கின் மின்னஞ்சல் முகவரியாகப் பயன்படுத்தக் கேட்டுள்ளீர்கள்.</p>
<p>உங்கள் குறியீடு <strong>{{.Code}}</strong>. நீங்கள் கேட்ட 10 நிமிடங்களுக்குப் பிறகு அது காலாவதியாகும்.</p>
<p>இதை நீங்கள் கேட்கவில்லை என்றால், இந்தச் செய்தியைப் புறக்கணிக்கலாம். உங்கள் கணக்கின் மின்னஞ்சல் முகவரி மாறாது.</p>
