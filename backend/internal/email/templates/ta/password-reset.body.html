    <p>உங்கள் Vetchium கடவுச்சொல்லை மீட்டமைப்பதற்கான கோரிக்கையைப் பெற்றோம்.</p>
    <p><a href="{{.ActionURL}}">புதிய கடவுச்சொல்லைத் தேர்ந்தெடுக்கவும்</a></p>
    <p>இந்த இணைப்பு {{.ExpiresAt.UTC.Format "02 Jan 2006 15:04 UTC"}} வரை செல்லுபடியாகும்.</p>
    <p>கடவுச்சொல் மீட்டமைப்பை நீங்கள் கோரவில்லை என்றால், இந்த மின்னஞ்சலைப் புறக்கணிக்கலாம்.</p>
