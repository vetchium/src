    <p>{{.Domain}} நிறுவனத்தின் நிலுவை விலைப்பட்டியல் இன்னும் செலுத்தப்படவில்லை. {{.ExpiresAt.UTC.Format "02 Jan 2006 15:04 UTC"}} க்குள் Vetchium நிறுவன போர்ட்டலில் அதைச் செலுத்தவும். இல்லையெனில் நிறுவனம் Free திட்டத்துக்கு மாறும்; அதன் வரம்புக்கு மேலுள்ள பயனர்கள் முடக்கப்படுவார்கள்.</p>
