    <p>திட்டமிடப்பட்ட மாற்றம் {{.Domain}} நிறுவனத்தின் திட்டத்தை {{.ExpiresAt.UTC.Format "02 Jan 2006 15:04 UTC"}} அன்று குறைக்கும்; அப்போது தற்போதைய திட்டத்தின் அம்சங்கள் முடிவடையும். தற்போதைய திட்டத்தை வைத்திருக்க, அதற்குள் Vetchium நிறுவன போர்ட்டலில் மீண்டும் அதைத் தேர்ந்தெடுக்கவும்.</p>
