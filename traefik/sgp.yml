# Routing inside the "sgp" tenant. Loaded by traefik-sgp via the file provider.
http:
  routers:
    orgs-api:
      rule: Host(`orgs-ui.sgp.localhost`) && (Path(`/api`) || PathPrefix(`/api/`))
      service: orgs-api
      entryPoints: [web]
      priority: 100

    orgs-ui:
      rule: Host(`orgs-ui.sgp.localhost`)
      service: orgs-ui
      entryPoints: [web]

    hub-api:
      rule: Host(`hub-ui.sgp.localhost`) && (Path(`/api`) || PathPrefix(`/api/`))
      service: hub-api
      entryPoints: [web]
      priority: 100

    hub-ui:
      rule: Host(`hub-ui.sgp.localhost`)
      service: hub-ui
      entryPoints: [web]

    admin-api:
      rule: Host(`admin-ui.sgp.localhost`) && (Path(`/api`) || PathPrefix(`/api/`))
      service: admin-api
      entryPoints: [web]
      priority: 100

    admin-ui:
      rule: Host(`admin-ui.sgp.localhost`)
      service: admin-ui
      entryPoints: [web]

  services:
    orgs-api:
      loadBalancer:
        servers:
          - url: http://orgs-api-sgp:8080
        healthCheck: {path: /api/readyz, interval: 10s, timeout: 3s}

    hub-api:
      loadBalancer:
        servers:
          - url: http://hub-api-sgp:8080
        healthCheck: {path: /api/readyz, interval: 10s, timeout: 3s}

    admin-api:
      loadBalancer:
        servers:
          - url: http://admin-api-sgp:8080
        healthCheck: {path: /api/readyz, interval: 10s, timeout: 3s}

    orgs-ui:
      loadBalancer:
        # The portals run nginx-unprivileged, which listens on 8080, not 80.
        servers:
          - url: http://orgs-ui-sgp:8080
        healthCheck: {path: /healthz, interval: 10s, timeout: 3s}

    hub-ui:
      loadBalancer:
        servers:
          - url: http://hub-ui-sgp:8080
        healthCheck: {path: /healthz, interval: 10s, timeout: 3s}

    admin-ui:
      loadBalancer:
        servers:
          - url: http://admin-ui-sgp:8080
        healthCheck: {path: /healthz, interval: 10s, timeout: 3s}
