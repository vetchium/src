version: '3.8'
services:
  traefik-sgp:
    image: traefik:v3.0
    command:
    - --api.insecure=true
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --providers.docker.network=sgp_ingress
    ports:
    - 8001:80
    networks:
    - sgp_ingress
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
  db-sgp:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tenant_db
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
    networks:
    - sgp_backend
    volumes:
    - ./migrations/sgp:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U pguser -d tenant_db
      interval: 5s
      timeout: 3s
      retries: 20
  migrate-common-sgp:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://pguser:pgpassword@db-sgp:5432/tenant_db?sslmode=disable
    networks:
    - sgp_backend
    depends_on:
      db-sgp:
        condition: service_healthy
  api-sgp:
    build:
      context: backend
    environment:
      ENV: dev
      TENANT_ID: sgp
      DATABASE_URL: postgres://pguser:pgpassword@db-sgp:5432/tenant_db?sslmode=disable
      PORTAL_PORT: '8080'
      MESH_PORT: '8081'
    networks:
    - sgp_ingress
    - sgp_backend
    - mesh
    depends_on:
      migrate-common-sgp:
        condition: service_completed_successfully
    labels:
    - traefik.enable=true
    - traefik.http.routers.api-sgp.rule=(Host(`orgs-ui.sgp.localhost`) || Host(`hub-ui.sgp.localhost`)
      || Host(`admin-ui.sgp.localhost`)) && PathPrefix(`/api`)
    - traefik.http.routers.api-sgp.entrypoints=web
    - traefik.http.services.api-sgp.loadbalancer.server.port=8080
    - traefik.docker.network=sgp_ingress
  orgs-ui-sgp:
    build:
      context: orgs-ui
    networks:
    - sgp_ingress
    labels:
    - traefik.enable=true
    - traefik.http.routers.orgs-ui-sgp.rule=Host(`orgs-ui.sgp.localhost`)
    - traefik.http.routers.orgs-ui-sgp.entrypoints=web
    - traefik.http.services.orgs-ui-sgp.loadbalancer.server.port=80
    - traefik.docker.network=sgp_ingress
  hub-ui-sgp:
    build:
      context: hub-ui
    networks:
    - sgp_ingress
    labels:
    - traefik.enable=true
    - traefik.http.routers.hub-ui-sgp.rule=Host(`hub-ui.sgp.localhost`)
    - traefik.http.routers.hub-ui-sgp.entrypoints=web
    - traefik.http.services.hub-ui-sgp.loadbalancer.server.port=80
    - traefik.docker.network=sgp_ingress
  admin-ui-sgp:
    build:
      context: admin-ui
    networks:
    - sgp_ingress
    labels:
    - traefik.enable=true
    - traefik.http.routers.admin-ui-sgp.rule=Host(`admin-ui.sgp.localhost`)
    - traefik.http.routers.admin-ui-sgp.entrypoints=web
    - traefik.http.services.admin-ui-sgp.loadbalancer.server.port=80
    - traefik.docker.network=sgp_ingress
