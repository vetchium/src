server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Do not advertise the nginx version to clients.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Static placeholder content: no framing, no MIME sniffing, no referrer leak.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Answers the container healthcheck without touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
