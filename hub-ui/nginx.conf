server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Do not advertise the nginx version to clients.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Answers the container healthcheck without touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Security headers, asset caching, noindex paths, and the SPA fallback,
    # generated at build time from the same region tables as the static
    # host's _headers file.
    include /etc/nginx/vetchium/portal.conf;
}
