server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Do not advertise the nginx version to clients.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Do not allow framing, MIME sniffing, or cross-origin referrer leakage.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The container root filesystem is read-only in production, so
    # runtime-config.sh writes the Content-Security-Policy header — whose
    # img-src lists every federated tenant's media origin, since a remote
    # profile picture renders directly from its owner's home tenant — to
    # this generated file under /tmp instead of templating this checked-in
    # one.
    include /tmp/vetchium-csp.conf;

    # Answers the container healthcheck without touching the filesystem.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /runtime-config.js {
        alias /tmp/vetchium-runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
