# Routing for the "deu" tenant. Hostnames come from this file, so a tenant can
# have whatever domains it needs without touching the others.
#
# Update the Host() rules to your real domains before the first deploy.
http:
  routers:
    orgs-api:
      rule: Host(`orgs.deu.vetchium.com`) && (Path(`/api`) || PathPrefix(`/api/`))
      service: orgs-api
      entryPoints: [web]
      priority: 100

    orgs-ui:
      rule: Host(`orgs.deu.vetchium.com`)
      service: orgs-ui
      entryPoints: [web]

    hub-api:
      rule: Host(`hub.deu.vetchium.com`) && (Path(`/api`) || PathPrefix(`/api/`))
      service: hub-api
      entryPoints: [web]
      priority: 100

    hub-ui:
      rule: Host(`hub.deu.vetchium.com`)
      service: hub-ui
      entryPoints: [web]

    admin-api:
      rule: Host(`admin.deu.vetchium.com`) && (Path(`/api`) || PathPrefix(`/api/`))
      service: admin-api
      entryPoints: [web]
      priority: 100

    admin-ui:
      rule: Host(`admin.deu.vetchium.com`)
      service: admin-ui
      entryPoints: [web]

  services:
    orgs-api:
      loadBalancer:
        servers: [{url: http://orgs-api:8080}]
        healthCheck: {path: /api/readyz, interval: 10s, timeout: 3s}

    hub-api:
      loadBalancer:
        servers: [{url: http://hub-api:8080}]
        healthCheck: {path: /api/readyz, interval: 10s, timeout: 3s}

    admin-api:
      loadBalancer:
        servers: [{url: http://admin-api:8080}]
        healthCheck: {path: /api/readyz, interval: 10s, timeout: 3s}

    orgs-ui:
      loadBalancer:
        servers:
          - url: http://orgs-ui:8080
        healthCheck: {path: /healthz, interval: 10s, timeout: 3s}

    hub-ui:
      loadBalancer:
        servers:
          - url: http://hub-ui:8080
        healthCheck: {path: /healthz, interval: 10s, timeout: 3s}

    admin-ui:
      loadBalancer:
        servers:
          - url: http://admin-ui:8080
        healthCheck: {path: /healthz, interval: 10s, timeout: 3s}
