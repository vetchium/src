server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    client_max_body_size 1k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "private, no-store" always;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only an individually signed, opaque picture key may reach private S3.
    # The browser Host is part of SigV4; never replace it with the S3 DNS name.
    location ~ "^/hub-profile-pictures/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
        limit_except GET { deny all; }
        proxy_pass http://seaweed-s3:8333;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
